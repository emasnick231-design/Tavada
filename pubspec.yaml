name: tavada_eats
description: "Tavada Eats — Always African, Anywhere. Food delivery for African cuisine."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  animations: ^3.0.0
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.3
  collection: ^1.19.1
  confetti: ^0.8.0
  connectivity_plus: ^7.3.2
  cupertino_ui: ^1.0.2
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  geolocator: ^14.0.1
  get_it: ^9.3.0
  go_router: ^18.1.1
  hydrated_bloc: ^11.0.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  logger: ^2.8.0
  material_ui: ^1.2.0
  meta: ^1.18.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pinput: ^7.0.0
  pretty_dio_logger: ^1.4.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  smooth_page_indicator: ^3.0.0
  stream_transform: ^2.1.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
flutter:
  uses-material-design: true
  generate: true
  default-flavor: dev

  assets:
    - assets/icons/
    - assets/flags/
    - assets/mock/
    - assets/images/brand/
    - assets/images/onboarding/
    - assets/images/categories/
    - assets/images/cuisines/
    - assets/images/dishes/
    - assets/images/restaurants/
    - assets/images/logos/
    - assets/images/illustrations/
    - assets/images/avatars/
    - assets/images/banners/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: ProtestStrike
      fonts:
        - asset: assets/fonts/ProtestStrike-Regular.ttf

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true
  assets:
    exclude:
      - assets/mock/**
  fonts:
    enabled: true
